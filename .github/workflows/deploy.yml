# Builds the Vite app and deploys it to GitHub Pages.
#
# ⚠️  PREREQUISITE: enable Pages first — repo Settings → Pages → Source:
# "GitHub Actions". Until then this workflow fails at the deploy step with a
# 404 (no Pages site to deploy to).
#
# Triggers on pushes to `main` and manual dispatch only (not feature branches),
# so it deploys deliberately from the merged state rather than failing on every
# work-in-progress push.
#
# ⚠️  The deployed build does NOT include an API key (VITE_ vars would be public
# — see README). So the live site is a UI shell: spinning works, but recipe
# generation only works locally with your own .env. This workflow exists to
# demonstrate the CI → Pages loop.
name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Builds the Vite app and deploys it to GitHub Pages on every push to the
# feature branch. Optional — enable Pages in repo Settings → Pages → "GitHub
# Actions" for it to publish.
#
# ⚠️  This build does NOT include your API key (see README security note). A
# deployed static build cannot safely hold a Claude key; the live recipe
# generation only works locally with your own .env. The deploy is here to
# demonstrate the CI → Pages workflow.
name: Deploy

on:
  push:
    branches: ["claude/app-project-ideas-5es0e5", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>CONTRA — Jungle Run</title>
<style>
  :root { --pad: env(safe-area-inset-bottom, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: "Courier New", monospace;
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #game-wrap {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center; background: #000;
  }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #1a2a3a; touch-action: none; display: block;
  }

  /* ---- Touch controls ---- */
  #touch-ui {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: none;
  }
  .touch .ctl { display: flex !important; }
  .ctl { pointer-events: auto; position: absolute; display: none; }

  #dpad {
    left: 14px; bottom: calc(20px + var(--pad));
    width: 168px; height: 168px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 4px;
  }
  .dbtn {
    background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.30);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: rgba(255,255,255,0.7); font-weight: bold;
  }
  .dbtn.active { background: rgba(255,210,0,0.45); border-color: #ffd200; }
  #d-up    { grid-area: 1 / 2; }
  #d-left  { grid-area: 2 / 1; }
  #d-right { grid-area: 2 / 3; }
  #d-down  { grid-area: 3 / 2; }
  .dcenter { grid-area: 2 / 2; background: rgba(255,255,255,0.04); border: none; }

  #act-buttons {
    right: 18px; bottom: calc(24px + var(--pad));
    width: 200px; height: 168px;
  }
  .abtn {
    position: absolute; width: 84px; height: 84px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.35); font-weight: bold;
    font-size: 15px; color: #fff; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.05;
  }
  #btn-jump { right: 96px; bottom: 0;  background: rgba(60,160,255,0.35); }
  #btn-fire { right: 0;   bottom: 56px; background: rgba(255,70,70,0.40); }
  .abtn.active { filter: brightness(1.6); transform: scale(0.94); }

  /* ---- Overlays ---- */
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); text-align: center; padding: 20px;
  }
  .hidden { display: none !important; }
  .title {
    font-size: clamp(34px, 11vw, 76px); font-weight: 900; letter-spacing: 4px;
    color: #ffd200; text-shadow: 3px 3px 0 #c0392b, 6px 6px 0 #7b241c;
    margin-bottom: 6px;
  }
  .subtitle { font-size: clamp(13px, 4vw, 18px); color: #9fd3ff; margin-bottom: 26px; letter-spacing: 2px; }
  .btn {
    pointer-events: auto; background: #c0392b; color: #fff; border: 3px solid #fff;
    font-family: inherit; font-weight: bold; font-size: clamp(16px, 5vw, 22px);
    padding: 14px 34px; border-radius: 8px; cursor: pointer; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .btn:active { transform: scale(0.96); background: #e74c3c; }
  .help {
    margin-top: 26px; font-size: clamp(11px, 3.4vw, 14px); color: #bbb;
    line-height: 1.7; max-width: 460px;
  }
  .help b { color: #ffd200; }
  #win-title { color: #5fe07a; text-shadow: 3px 3px 0 #1e7d34; }
  #over-title { color: #e74c3c; text-shadow: 3px 3px 0 #5b1a13; }
</style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="screen" width="480" height="270"></canvas>
  </div>

  <div id="touch-ui">
    <div id="dpad" class="ctl">
      <div class="dbtn" id="d-up" data-dir="up">▲</div>
      <div class="dbtn" id="d-left" data-dir="left">◀</div>
      <div class="dcenter"></div>
      <div class="dbtn" id="d-right" data-dir="right">▶</div>
      <div class="dbtn" id="d-down" data-dir="down">▼</div>
    </div>
    <div id="act-buttons" class="ctl">
      <div class="abtn" id="btn-jump" data-act="jump">JUMP</div>
      <div class="abtn" id="btn-fire" data-act="fire">FIRE</div>
    </div>
  </div>

  <div id="start-screen" class="overlay">
    <div class="title">CONTRA</div>
    <div class="subtitle">JUNGLE RUN</div>
    <button class="btn" id="start-btn">▶ Start</button>
    <div class="help">
      <b>Touch:</b> D-pad to move &amp; aim · JUMP · FIRE<br>
      <b>Keyboard:</b> <b>←→</b> move · <b>↑↓</b> aim · <b>Z</b> jump · <b>X</b> fire<br>
      Grab the <b>S</b> pod for the spread gun. Reach &amp; destroy the boss!
    </div>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <div class="title" id="over-title">GAME OVER</div>
    <div class="subtitle" id="over-score">SCORE 0</div>
    <button class="btn" id="retry-btn">↻ Retry</button>
  </div>

  <div id="win-screen" class="overlay hidden">
    <div class="title" id="win-title">CLEARED!</div>
    <div class="subtitle" id="win-score">SCORE 0</div>
    <button class="btn" id="again-btn">↻ Play Again</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
